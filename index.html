<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nedsläpp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0F1E33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nedsläpp">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4F8;--card:#fff;--ink:#0F1E33;--mute:#5B6B80;--line:#D5E0EA;--red:#D62839;--blue:#1F5FA8;--hi:#FBE3E6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1524;--card:#14233A;--ink:#EAF2F9;--mute:#93A5BA;--line:#24364F;--red:#FF5A67;--blue:#6FAAF0;--hi:#3A1F2B}}
:root[data-theme="dark"]{--bg:#0B1524;--card:#14233A;--ink:#EAF2F9;--mute:#93A5BA;--line:#24364F;--red:#FF5A67;--blue:#6FAAF0;--hi:#3A1F2B}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif}
.app{max-width:560px;margin:0 auto;padding:0 16px 48px}
h1{font:700 44px/1 "Barlow Condensed",Impact,sans-serif;margin:22px 0 4px}
h1 i{font-style:normal;color:var(--red)}
.sub{color:var(--mute);margin:0 0 16px}
.ctl{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:6px}
label{display:flex;gap:8px;align-items:center;font-size:15px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px Barlow,system-ui,sans-serif}
.day{font:700 20px "Barlow Condensed",sans-serif;color:var(--mute);margin:22px 0 8px}
.m{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.m.f{border-left:5px solid var(--red);background:linear-gradient(var(--hi),var(--hi)),var(--card)}
.t{font:700 22px/1.15 "Barlow Condensed",sans-serif}
.t span{color:var(--mute);font-weight:600;padding:0 4px}
.tm{font:700 26px "Barlow Condensed",sans-serif;grid-row:1;grid-column:2}
.ar{color:var(--mute);font-size:14px;grid-column:1 / 3}
.empty,.note{color:var(--mute);font-size:14px}
.empty{text-align:center;padding:30px 0}
.note{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
a{color:var(--blue)}
select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<h1>Ned<i>släpp</i></h1>
<p class="sub">Alla SHL-matcher med tid och arena.</p>
<div class="ctl">
<select id="fav" aria-label="Favoritlag"></select>
<label><input type="checkbox" id="only"> Visa bara mitt favoritlag</label>
<label><input type="checkbox" id="past"> Visa spelade matcher</label>
</div>
<main id="list"><p class="empty">Hämtar spelschemat...</p></main>
<p class="note" id="note">Schemat hämtas från SHL:s kalender. Aktuellt schema finns på <a href="https://www.shl.se/game-schedule">shl.se</a>. Alla tider visas i svensk tid.</p>
</div>
<script>
const tz='Europe/Stockholm';
const fd=new Intl.DateTimeFormat('sv-SE',{weekday:'long',day:'numeric',month:'long',timeZone:tz});
const ft=new Intl.DateTimeFormat('sv-SE',{hour:'2-digit',minute:'2-digit',timeZone:tz});
const fu=new Intl.DateTimeFormat('sv-SE',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:tz});
const $=s=>document.querySelector(s);
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let M=[],fav=get('ned_fav',''),only=get('ned_only','0')==='1',past=get('ned_past','0')==='1';
const sel=$('#fav');
function render(){
 const el=$('#list');el.innerHTML='';let last='',n=0;const lim=Date.now()-3*36e5;
 M.forEach(m=>{
  if(!past&&m.t<lim)return;
  const isF=fav&&(m.h===fav||m.a===fav);
  if(only&&fav&&!isF)return;
  const d=fd.format(m.t);
  if(d!==last){const h=document.createElement('div');h.className='day';h.textContent=d[0].toUpperCase()+d.slice(1);el.append(h);last=d}
  const c=document.createElement('div');c.className='m'+(isF?' f':'');
  const t=document.createElement('div');t.className='t';t.textContent=m.h+' – '+m.a;
  const tm=document.createElement('div');tm.className='tm';tm.textContent=ft.format(m.t);
  const ar=document.createElement('div');ar.className='ar';ar.textContent=(m.arena||'Arena saknas')+' (hemma för '+m.h+')';
  c.append(t,tm,ar);el.append(c);n++});
 if(!n)el.innerHTML='<p class="empty">Inga matcher att visa.</p>';
}
fetch('data/schedule.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
 M=j.matches.map(m=>({...m,t:new Date(m.t)}));
 const teams=[...new Set(M.flatMap(m=>[m.h,m.a]))].sort((a,b)=>a.localeCompare(b,'sv'));
 if(!teams.includes(fav))fav='';
 sel.innerHTML='<option value="">Välj favoritlag</option>'+teams.map(t=>`<option>${t}</option>`).join('');
 sel.value=fav;$('#only').checked=only;$('#past').checked=past;
 $('#note').insertAdjacentHTML('afterbegin','Schemat uppdaterades '+fu.format(new Date(j.updated))+' och kontrolleras varje natt. ');
 render();
}).catch(()=>{$('#list').innerHTML='<p class="empty">Kunde inte hämta spelschemat. Försök igen senare.</p>'});
sel.onchange=()=>{fav=sel.value;set('ned_fav',fav);render()};
$('#only').onchange=e=>{only=e.target.checked;set('ned_only',only?'1':'0');render()};
$('#past').onchange=e=>{past=e.target.checked;set('ned_past',past?'1':'0');render()};
</script>
</body>
</html>
