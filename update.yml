name: Uppdatera schema
on:
  schedule:
    - cron: '17 3 * * *'   # varje natt
  workflow_dispatch:        # gör att du kan köra den för hand
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: Spara ändringar
        run: |
          git config user.name "schema-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/schedule.json
          git diff --cached --quiet || (git commit -m "Uppdatera schema" && git push)
